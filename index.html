<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti 💛</title>
  <style>
    :root {
      --bg: #0b0f19;
      --accent: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      color: #fef08a;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
      margin-bottom: 15px;
    }

    /* Selector de Estilos */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 400px;
      margin-bottom: 15px;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(250, 204, 21, 0.3);
      color: #fef08a;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover, .btn.active {
      background: #facc15;
      color: #0b0f19;
      font-weight: bold;
      box-shadow: 0 0 12px #facc15;
    }

    /* Contenedor del Ramo SVG */
    .svg-container {
      width: 100%;
      max-width: 360px;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    svg {
      width: 100%;
      height: auto;
      max-height: 55vh;
      transition: all 0.5s ease;
    }

    /* ESTILOS VISUALES */
    /* 1. Clásico */
    .style-classic .petal { fill: #facc15; stroke: #eab308; stroke-width: 1.5; }
    .style-classic .center { fill: #d97706; }
    .style-classic .stem { stroke: #15803d; stroke-width: 4; }
    .style-classic .leaf { fill: #22c55e; }
    .style-classic .ribbon { fill: #f43f5e; }

    /* 2. Líneas */
    .style-lines .petal, .style-lines .center, .style-lines .leaf, .style-lines .ribbon {
      fill: none !important;
      stroke: #fef08a !important;
      stroke-width: 2 !important;
      filter: drop-shadow(0 0 3px #facc15);
    }
    .style-lines .stem { stroke: #fef08a !important; stroke-width: 2 !important; }

    /* 3. Puntos / Puntillismo */
    .style-dots .petal { fill: url(#dot-pattern) !important; stroke: none; }
    .style-dots .center { fill: #fef08a; }
    .style-dots .leaf { fill: url(#leaf-dots) !important; }
    .style-dots .stem { stroke: #22c55e; stroke-dasharray: 2 4; stroke-width: 5; }

    /* 4. Mandala */
    .style-mandala .petal { fill: #fef08a; stroke: #b45309; stroke-width: 1; }
    .style-mandala .center { fill: #f59e0b; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 2 2; }
    .style-mandala .leaf { fill: #047857; stroke: #fef08a; stroke-width: 1; }

    /* 5. Patrones */
    .style-patterns .petal { fill: url(#stripe-pattern) !important; stroke: #eab308; }
    .style-patterns .leaf { fill: url(#leaf-pattern) !important; }

    /* 6. Neón */
    .style-neon .petal { fill: none; stroke: #facc15; stroke-width: 3; filter: drop-shadow(0 0 8px #facc15); }
    .style-neon .center { fill: #fff; filter: drop-shadow(0 0 10px #facc15); }
    .style-neon .stem { stroke: #4ade80; stroke-width: 3; filter: drop-shadow(0 0 6px #4ade80); }
    .style-neon .leaf { fill: none; stroke: #4ade80; stroke-width: 2; }
    .style-neon .ribbon { fill: none; stroke: #ff4d6d; stroke-width: 3; filter: drop-shadow(0 0 6px #ff4d6d); }

    /* Partículas al tocar */
    .sparkle {
      position: absolute;
      pointer-events: none;
      background: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 8px #facc15;
      animation: fade-out 1.2s forwards ease-out;
    }

    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.1) translateY(-15px); }
    }
  </style>
</head>
<body>

  <h1>Flores amarillas para ti 💛</h1>

  <div class="controls">
    <button class="btn active" onclick="setStyle('classic', event)">Clásico</button>
    <button class="btn" onclick="setStyle('lines', event)">Líneas</button>
    <button class="btn" onclick="setStyle('dots', event)">Puntos</button>
    <button class="btn" onclick="setStyle('mandala', event)">Mandala</button>
    <button class="btn" onclick="setStyle('patterns', event)">Patrones</button>
    <button class="btn" onclick="setStyle('neon', event)">Neón</button>
  </div>

  <div class="svg-container">
    <svg id="flower-svg" class="style-classic" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Patrón de Puntos -->
        <pattern id="dot-pattern" width="6" height="6" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.5" fill="#facc15" />
        </pattern>
        <pattern id="leaf-dots" width="6" height="6" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.5" fill="#22c55e" />
        </pattern>
        <!-- Patrón de Rayas -->
        <pattern id="stripe-pattern" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#facc15" stroke-width="4" />
          <line x1="4" y1="0" x2="4" y2="8" stroke="#ca8a04" stroke-width="4" />
        </pattern>
        <pattern id="leaf-pattern" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#15803d" stroke-width="4" />
          <line x1="4" y1="0" x2="4" y2="8" stroke="#4ade80" stroke-width="4" />
        </pattern>
      </defs>

      <!-- Tallos -->
      <path class="stem" d="M 110,250 Q 130,320 135,370" fill="none"/>
      <path class="stem" d="M 130,240 Q 140,310 145,370" fill="none"/>
      <path class="stem" d="M 150,230 Q 150,300 150,370" fill="none"/>
      <path class="stem" d="M 170,240 Q 160,310 155,370" fill="none"/>
      <path class="stem" d="M 190,250 Q 170,320 165,370" fill="none"/>

      <!-- Hojas -->
      <path class="leaf" d="M 100,280 Q 70,260 80,290 Q 110,300 115,285 Z" />
      <path class="leaf" d="M 200,280 Q 230,260 220,290 Q 190,300 185,285 Z" />

      <!-- Cinta -->
      <path class="ribbon" d="M 130,330 Q 150,325 170,330 Q 165,345 150,345 Q 135,345 130,330 Z" />
      <path class="ribbon" d="M 140,342 L 130,375 L 145,370 Z" />
      <path class="ribbon" d="M 160,342 L 170,375 L 155,370 Z" />

      <!-- Flor 1 (Izquierda Abajo) -->
      <g transform="translate(90, 190)">
        <circle class="petal" cx="0" cy="-22" r="12"/>
        <circle class="petal" cx="15" cy="-15" r="12"/>
        <circle class="petal" cx="22" cy="0" r="12"/>
        <circle class="petal" cx="15" cy="15" r="12"/>
        <circle class="petal" cx="0" cy="22" r="12"/>
        <circle class="petal" cx="-15" cy="15" r="12"/>
        <circle class="petal" cx="-22" cy="0" r="12"/>
        <circle class="petal" cx="-15" cy="-15" r="12"/>
        <circle class="center" cx="0" cy="0" r="12"/>
      </g>

      <!-- Flor 2 (Izquierda Arriba) -->
      <g transform="translate(110, 110)">
        <circle class="petal" cx="0" cy="-25" r="14"/>
        <circle class="petal" cx="18" cy="-18" r="14"/>
        <circle class="petal" cx="25" cy="0" r="14"/>
        <circle class="petal" cx="18" cy="18" r="14"/>
        <circle class="petal" cx="0" cy="25" r="14"/>
        <circle class="petal" cx="-18" cy="18" r="14"/>
        <circle class="petal" cx="-25" cy="0" r="14"/>
        <circle class="petal" cx="-18" cy="-18" r="14"/>
        <circle class="center" cx="0" cy="0" r="14"/>
      </g>

      <!-- Flor 3 (Centro Principal) -->
      <g transform="translate(150, 150)">
        <circle class="petal" cx="0" cy="-30" r="16"/>
        <circle class="petal" cx="21" cy="-21" r="16"/>
        <circle class="petal" cx="30" cy="0" r="16"/>
        <circle class="petal" cx="21" cy="21" r="16"/>
        <circle class="petal" cx="0" cy="30" r="16"/>
        <circle class="petal" cx="-21" cy="21" r="16"/>
        <circle class="petal" cx="-30" cy="0" r="16"/>
        <circle class="petal" cx="-21" cy="-21" r="16"/>
        <circle class="center" cx="0" cy="0" r="16"/>
      </g>

      <!-- Flor 4 (Derecha Arriba) -->
      <g transform="translate(190, 110)">
        <circle class="petal" cx="0" cy="-25" r="14"/>
        <circle class="petal" cx="18" cy="-18" r="14"/>
        <circle class="petal" cx="25" cy="0" r="14"/>
        <circle class="petal" cx="18" cy="18" r="14"/>
        <circle class="petal" cx="0" cy="25" r="14"/>
        <circle class="petal" cx="-18" cy="18" r="14"/>
        <circle class="petal" cx="-25" cy="0" r="14"/>
        <circle class="petal" cx="-18" cy="-18" r="14"/>
        <circle class="center" cx="0" cy="0" r="14"/>
      </g>

      <!-- Flor 5 (Derecha Abajo) -->
      <g transform="translate(210, 190)">
        <circle class="petal" cx="0" cy="-22" r="12"/>
        <circle class="petal" cx="15" cy="-15" r="12"/>
        <circle class="petal" cx="22" cy="0" r="12"/>
        <circle class="petal" cx="15" cy="15" r="12"/>
        <circle class="petal" cx="0" cy="22" r="12"/>
        <circle class="petal" cx="-15" cy="15" r="12"/>
        <circle class="petal" cx="-22" cy="0" r="12"/>
        <circle class="petal" cx="-15" cy="-15" r="12"/>
        <circle class="center" cx="0" cy="0" r="12"/>
      </g>
    </svg>
  </div>

  <script>
    function setStyle(styleName, ev) {
      const svg = document.getElementById('flower-svg');
      const buttons = document.querySelectorAll('.btn');
      
      svg.className.baseVal = 'style-' + styleName;
      
      buttons.forEach(b => b.classList.remove('active'));
      if (ev && ev.target) {
        ev.target.classList.add('active');
      }
    }

    /* Brillos al tocar o mover pantalla */
    document.addEventListener('mousemove', createSparkle);
    document.addEventListener('touchmove', (e) => {
      createSparkle(e.touches[0]);
    });

    function createSparkle(e) {
      const sparkle = document.createElement('div');
      sparkle.classList.add('sparkle');
      
      const size = Math.random() * 6 + 4;
      sparkle.style.width = `${size}px`;
      sparkle.style.height = `${size}px`;
      
      sparkle.style.left = `${e.clientX}px`;
      sparkle.style.top = `${e.clientY}px`;

      document.body.appendChild(sparkle);

      setTimeout(() => {
        sparkle.remove();
      }, 1200);
    }
  </script>
</body>
</html>
